
name: Build D20 Game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot

      - name: Install Web export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q Godot_v4.3-stable_export_templates.tpz
          cp templates/* ~/.local/share/godot/export_templates/4.3.stable/

      - name: Unpack game
        run: |
          unzip -q D20_Novyi_Mir_Godot_v0_2.zip -d game
          echo "GAME_DIR=$PWD/game/D20_Novyi_Mir_Godot_v0_2" >> "$GITHUB_ENV"

      - name: Configure Web export
        run: |
          cat > "$GAME_DIR/export_presets.cfg" <<'EOF'
          [preset.0]

          name="Web"
          platform="Web"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="index.html"

          [preset.0.options]

          variant/extensions_support=false
          vram_texture_compression/for_desktop=true
          vram_texture_compression/for_mobile=false
          html/export_icon=false
          html/custom_html_shell=""
          html/head_include=""
          html/canvas_resize_policy=2
          html/focus_canvas_on_start=true
          html/experimental_virtual_keyboard=false
          progressive_web_app/enabled=false
          EOF

      - name: Import and export
        run: |
          godot --headless --editor --path "$GAME_DIR" --import 2>&1 | tee import.log
          ! grep -E "SCRIPT ERROR|Parse Error" import.log
          mkdir -p site
          godot --headless --path "$GAME_DIR" --export-release Web "$PWD/site/index.html" 2>&1 | tee export.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR:.*Export" export.log
          test -s site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
