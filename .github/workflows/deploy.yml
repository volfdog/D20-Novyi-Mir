name: Build D20 Game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

      - name: Install Web export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q Godot_v4.3-stable_export_templates.tpz
          cp templates/* ~/.local/share/godot/export_templates/4.3.stable/

      - name: Unpack latest game
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'D20_Novyi_Mir_Godot_v*.zip' | sort -V | tail -n 1)
          test -n "$ZIP_FILE" || { echo "Game ZIP not found"; exit 1; }
          echo "Selected: $ZIP_FILE"
          mkdir -p game
          unzip -q "$ZIP_FILE" -d game
          PROJECT_FILE=$(find "$PWD/game" -name project.godot -type f -print -quit)
          test -n "$PROJECT_FILE" || { echo "project.godot not found"; exit 1; }
          echo "GAME_DIR=$(dirname "$PROJECT_FILE")" >> "$GITHUB_ENV"

      - name: Configure Web export
        run: |
          cat > "$GAME_DIR/export_presets.cfg" <<'EOF'
          [preset.0]

          name="Web"
          platform="Web"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="index.html"

          [preset.0.options]

          variant/extensions_support=false
          vram_texture_compression/for_desktop=true
          vram_texture_compression/for_mobile=false
          html/export_icon=false
          html/custom_html_shell=""
          html/head_include=""
          html/canvas_resize_policy=2
          html/focus_canvas_on_start=true
          html/experimental_virtual_keyboard=false
          progressive_web_app/enabled=false
          EOF

      - name: Import and export
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --editor --path "$GAME_DIR" --import 2>&1 | tee import.log
          if grep -E "SCRIPT ERROR|Parse Error" import.log; then
            exit 1
          fi
          mkdir -p site
          godot --headless --path "$GAME_DIR" --export-release Web "$PWD/site/index.html" 2>&1 | tee export.log
          if grep -E "SCRIPT ERROR|Parse Error|ERROR:.*Export" export.log; then
            exit 1
          fi
          test -s site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4


